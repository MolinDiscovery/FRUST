<!doctype html>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<div id="viewer" style="width:400px;height:320px;position:relative"></div>
<button id="advance">Render 200 frame changes</button>
<pre id="stats"></pre>
<script>
const viewer = $3Dmol.createViewer(document.getElementById('viewer'));
viewer.addModel('3\nwater\nO 0 0 0\nH 0.96 0 0\nH -0.24 0.93 0\n', 'xyz');
viewer.setStyle({}, {sphere: {scale: 0.3}, stick: {radius: 0.2}});
viewer.mapAtomProperties([
  {index: 0, props: {dx: 0, dy: 0.02, dz: 0}},
  {index: 1, props: {dx: 0.2, dy: -0.02, dz: 0}},
  {index: 2, props: {dx: -0.2, dy: -0.02, dz: 0}}
]);
viewer.vibrate(20, 0.7, true);
viewer.setClickable({}, true, function() {});
viewer.zoomTo();
viewer.render();
const model = viewer.getModel();
const clickableFrame = model.frames.findIndex(frame => frame.some(atom => atom.clickable));
function snapshot() {
  const sample = {
    frames: model.getNumFrames(),
    pickingShapes: model.frames.reduce((n, frame) => n + frame.reduce((n, atom) =>
      n + Object.values(atom.intersectionShape || {}).reduce((n, a) => n + a.length, 0), 0), 0),
    geometryCounter: viewer.getRenderer().info.memory.geometries
  };
  document.getElementById('stats').textContent += JSON.stringify(sample) + '\n';
}
snapshot();
document.getElementById('advance').onclick = async function() {
  for (let i = 0; i < 200; i++) {
    await viewer.setFrame(i % 2 ? clickableFrame : (clickableFrame + 1) % model.getNumFrames());
    viewer.render();
  }
  snapshot();
};
</script>
